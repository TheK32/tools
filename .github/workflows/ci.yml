name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check Bash syntax
        run: |
          bash -n service-manager-cn.sh
          bash -n tests/test-service-manager-cn.sh
      - name: Run ShellCheck
        run: shellcheck service-manager-cn.sh tests/test-service-manager-cn.sh
      - name: Run tests
        run: bash tests/test-service-manager-cn.sh
